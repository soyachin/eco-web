<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/ComicShannsMono-Regular.otf" as="font" type="font/otf" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Tactile&family=Inconsolata:wght@200..900&family=Victor+Mono:ital,wght@1,400..700&display=swap" rel="stylesheet">

    <script>
    // Establecer tema oscuro como default inmediatamente
    (function () {
      try {
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        // Esperar a que el body exista
        document.addEventListener('DOMContentLoaded', function () {
          document.body.className = 'bg-background text-foreground';
        });
      } catch (e) {
        console.error("Error cargando tema:", e);
      }
    })();
  </script>

  <style>
    /* Variables Gruvbox críticas */
    :root {
      --bg-primary: #282828;
      --fg-primary: #ebdbb2;
    }

    /* Estilos críticos para evitar flashing */
    html,
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Tema oscuro por defecto - usar variables CSS */
    html[data-theme="dark"] {
      background-color: var(--bg-primary);
      color: var(--fg-primary);
    }
  </style>

  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-background text-foreground">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
